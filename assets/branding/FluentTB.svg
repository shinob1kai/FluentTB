<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">FluentTB</title>
  <desc id="desc">The original white F and blue taskbar, with layered pink Fluent-style panels.</desc>
  <defs>
    <linearGradient id="panel" x1="56" y1="28" x2="251" y2="219" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67D8F4"/>
      <stop offset="0.48" stop-color="#37A9D5"/>
      <stop offset="1" stop-color="#1680B8"/>
    </linearGradient>
    <linearGradient id="pink" x1="160" y1="192" x2="160" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9ACF"/>
      <stop offset="0.52" stop-color="#F64D9B"/>
      <stop offset="1" stop-color="#D82F72"/>
    </linearGradient>
    <linearGradient id="rose" x1="102" y1="239" x2="226" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C32170"/>
      <stop offset="1" stop-color="#AD1545"/>
    </linearGradient>
    <linearGradient id="taskbarGradient" x1="54" y1="190" x2="261" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#244F78"/>
      <stop offset="1" stop-color="#163452"/>
    </linearGradient>
    <linearGradient id="edge" x1="160" y1="28" x2="160" y2="209" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.48"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="panelShadow" x="0" y="0" width="320" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#172943" flood-opacity="0.18"/>
    </filter>
    <filter id="glyphShadow" x="90" y="50" width="140" height="150" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#174E73" flood-opacity="0.23"/>
    </filter>
  </defs>
  <!-- Receding layers borrow the pink reference's silhouette, not its media glyphs. -->
  <g id="back-layers">
    <rect x="76" y="232" width="168" height="57" rx="27" fill="url(#rose)"/>
    <rect x="48" y="192" width="224" height="70" rx="32" fill="url(#pink)"/>
  </g>
  <g id="blue-panel" filter="url(#panelShadow)">
    <rect x="34" y="28" width="252" height="192" rx="43" fill="url(#panel)"/>
    <rect x="35" y="29" width="250" height="190" rx="42" stroke="url(#edge)" stroke-width="2"/>
  </g>
  <!-- Outlined glyph: no installed font is needed to render the original F motif. -->
  <path id="fluent-f" d="M129 65H195Q201 65 201 71V82Q201 88 195 88H151V111H184Q190 111 190 117V128Q190 134 184 134H151V168Q151 174 145 174H129Q123 174 123 168V71Q123 65 129 65Z" fill="white" filter="url(#glyphShadow)"/>
  <g id="taskbar" filter="url(#panelShadow)">
    <rect x="18" y="190" width="284" height="49" rx="17" fill="url(#taskbarGradient)"/>
    <path d="M36 191H284" stroke="white" stroke-opacity="0.13" stroke-linecap="round"/>
  </g>
</svg>
